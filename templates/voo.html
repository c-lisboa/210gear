{% extends "base.html" %}
{% block titulo %}Buscar voo{% endblock %}
{% block conteudo %}
<h1>✈️ Buscar voo por número</h1>

<form onsubmit="buscarVoo(event)">
  <input id="callsign" placeholder="Ex: TAM3456, GLO1234, AZU4021" autofocus>
  <button>Buscar</button>
</form>

<p id="status" style="margin-top:10px;color:#7f8c8d"></p>

<div id="resultado" style="display:none">
  <div class="badge-resumo" id="cabecalho" style="background:#1a3a5a"></div>

  <p id="aoVivo" style="margin:8px 0;font-size:13px;color:#7f8c8d"></p>

  <div id="fotoVoo" style="margin:12px 0"></div>

  <table>
    <tr><th>Campo</th><th>Valor</th></tr>
    <tbody id="detalhes"></tbody>
  </table>

  <button id="btnMapa" style="margin-bottom:20px">🗺️ Ver no mapa ao vivo</button>

  <div id="mapa" style="height:320px"></div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ─────────────────────────────────────────────
// Configuração da atualização automática
// ─────────────────────────────────────────────
const INTERVALO_MS = 10000;   // atualiza a cada 10 segundos
const MAX_FALHAS   = 3;       // para depois de 3 falhas seguidas

let mapaVoo = null, marcadorVoo = null, rastroVoo = null;
let csAtual = null;           // voo sendo acompanhado
let buscaId = 0;              // evita misturar voos diferentes
let timerVoo = null, timerRelogio = null;
let ultimaAtualizacao = null, falhas = 0;

function corPorAltitude(alt, solo) {
  if (solo) return "#9e9e9e";
  if (alt < 1500) return "#ff5252";
  if (alt < 4000) return "#ffab40";
  if (alt < 8000) return "#e0c000";
  return "#0077cc";
}

function iconeAviao(a) {
  const cor = corPorAltitude(a.alt, a.solo);
  return L.divIcon({
    className: '',
    html: `<div style="transform:rotate(${a.rumo}deg);font-size:26px;
             color:${cor};text-shadow:0 0 6px ${cor}">✈️</div>`,
    iconSize: [26, 26], iconAnchor: [13, 13]
  });
}

// ─────────────────────────────────────────────
// Liga / desliga a atualização automática
// ─────────────────────────────────────────────
function pararAtualizacao(mensagem) {
  clearInterval(timerVoo);
  clearInterval(timerRelogio);
  timerVoo = timerRelogio = null;
  if (mensagem) document.getElementById('aoVivo').textContent = mensagem;
}

function iniciarAtualizacao() {
  pararAtualizacao();
  falhas = 0;
  ultimaAtualizacao = Date.now();
  mostrarRelogio();
  timerVoo = setInterval(atualizarVoo, INTERVALO_MS);
  timerRelogio = setInterval(mostrarRelogio, 1000);
}

function mostrarRelogio() {
  if (!ultimaAtualizacao) return;
  const s = Math.round((Date.now() - ultimaAtualizacao) / 1000);
  document.getElementById('aoVivo').textContent =
    `🟢 Ao vivo — atualizado há ${s} s`;
}

// ─────────────────────────────────────────────
// Foto (só na primeira busca)
// ─────────────────────────────────────────────
async function carregarFoto(icao, registro) {
  const div = document.getElementById('fotoVoo');
  div.innerHTML = "";
  if (!icao) return;
  try {
    const url = '/api/foto/' + icao +
      (registro ? '?reg=' + encodeURIComponent(registro) : '');
    const r = await fetch(url);
    const foto = await r.json();
    if (foto && foto.thumb) {
      div.innerHTML = `
        <a href="${foto.link}" target="_blank">
          <img src="${foto.thumb}" alt="Foto da aeronave"
               style="width:100%;max-width:400px;border-radius:8px;display:block">
        </a>
        ${foto.autor ? `<div style="font-size:11px;opacity:.7;margin-top:4px">📷 ${foto.autor}</div>` : ""}`;
    }
  } catch (e) {}
}

// ─────────────────────────────────────────────
// Preenche cabeçalho, tabela e mapa
// ─────────────────────────────────────────────
function mostrarDados(a, primeiraVez) {
  document.getElementById('cabecalho').innerHTML =
    `<span class="badge-icone">${a.bandeira}</span> ${a.callsign}
     ${a.emergencia ? '🚨 EMERGÊNCIA' : ''}`;

  const linhas = [
    ["Situação", a.solo ? "No solo" : "Em voo"],
    ["Altitude", Math.round(a.alt) + " ft"],
    ["Velocidade", Math.round(a.veloc) + " nós"],
    ["Rumo (proa)", Math.round(a.rumo) + "°"],
    ["Subindo/Descendo", a.subindo > 100 ? "⬆️ Subindo" : a.subindo < -100 ? "⬇️ Descendo" : "➡️ Nivelado"],
    ["País", a.pais],
    ["Matrícula", a.registro || "—"],
    ["Tipo", (a.tipo || "—") + (a.modelo ? " – " + a.modelo : "")],
    ["ICAO24", a.icao],
    ["Squawk", a.squawk || "—"],
  ];
  document.getElementById('detalhes').innerHTML =
    linhas.map(([k, v]) => `<tr><td><b>${k}</b></td><td>${v}</td></tr>`).join('');

  document.getElementById('btnMapa').onclick = () => {
    window.open(`/mapa?lat=${a.lat}&lon=${a.lon}&raio=40`, '_blank');
  };

  if (a.lat == null || a.lon == null) {
    document.getElementById('status').textContent =
      "Voo encontrado, mas sem posição no momento.";
    return;
  }

  const pos = [a.lat, a.lon];

  if (!mapaVoo) {
    mapaVoo = L.map('mapa').setView(pos, 8);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      { attribution: '© OpenStreetMap' }).addTo(mapaVoo);
  }

  if (primeiraVez) {
    // novo voo: limpa marcador e rastro antigos
    if (marcadorVoo) mapaVoo.removeLayer(marcadorVoo);
    if (rastroVoo) mapaVoo.removeLayer(rastroVoo);
    mapaVoo.setView(pos, 8);
    rastroVoo = L.polyline([pos], { color: '#0077cc', weight: 2, dashArray: '4 6' }).addTo(mapaVoo);
    marcadorVoo = L.marker(pos, { icon: iconeAviao(a) })
      .addTo(mapaVoo).bindPopup(`<b>${a.callsign}</b>`).openPopup();
    setTimeout(() => mapaVoo.invalidateSize(), 200);
  } else {
    // mesmo voo: só move o avião e estica o rastro
    marcadorVoo.setLatLng(pos);
    marcadorVoo.setIcon(iconeAviao(a));
    rastroVoo.addLatLng(pos);
    if (!mapaVoo.getBounds().contains(pos)) mapaVoo.panTo(pos);
  }
}

// ─────────────────────────────────────────────
// Busca inicial (quando clica em "Buscar")
// ─────────────────────────────────────────────
async function buscarVoo(ev) {
  ev.preventDefault();
  const cs = document.getElementById('callsign').value.trim();
  if (!cs) return;

  pararAtualizacao();
  const meuId = ++buscaId;
  csAtual = cs;

  const status = document.getElementById('status');
  const resultado = document.getElementById('resultado');
  status.textContent = "🔎 Buscando...";
  resultado.style.display = "none";
  document.getElementById('fotoVoo').innerHTML = "";
  document.getElementById('aoVivo').textContent = "";

  try {
    const r = await fetch('/api/voo/' + encodeURIComponent(cs));
    const a = await r.json();
    if (meuId !== buscaId) return;   // usuário já buscou outro voo

    if (a.erro) { status.textContent = "⚠️ " + a.erro; return; }

    status.textContent = "";
    resultado.style.display = "block";
    carregarFoto(a.icao, a.registro);
    mostrarDados(a, true);

    if (a.solo) {
      pararAtualizacao("🛬 Avião no solo — atualização automática desligada.");
    } else {
      iniciarAtualizacao();
    }
  } catch (e) {
    status.textContent = "❌ Erro ao buscar.";
  }
}

// ─────────────────────────────────────────────
// Atualização automática (a cada 10 s)
// ─────────────────────────────────────────────
async function atualizarVoo() {
  if (!csAtual || document.hidden) return;   // economiza se a aba estiver escondida
  const meuId = buscaId;

  try {
    const r = await fetch('/api/voo/' + encodeURIComponent(csAtual));
    const a = await r.json();
    if (meuId !== buscaId) return;

    if (a.erro) {
      falhas++;
      if (falhas >= MAX_FALHAS) {
        pararAtualizacao("⚠️ O avião saiu do radar — atualização parada.");
      }
      return;
    }

    falhas = 0;
    ultimaAtualizacao = Date.now();
    mostrarDados(a, false);
    mostrarRelogio();

    if (a.solo) {
      pararAtualizacao("🛬 O avião pousou — atualização automática desligada.");
    }
  } catch (e) {
    falhas++;
    if (falhas >= MAX_FALHAS) {
      pararAtualizacao("❌ Sem conexão — atualização parada. Busque de novo.");
    }
  }
}
</script>
{% endblock %}
