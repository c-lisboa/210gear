<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radar de Aviação - RJ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; display: flex; flex-direction: column;
           height: 100vh; overflow: hidden; background: #05140a; }

    nav {
      background: #0a1f12; padding: 10px 15px; display: flex; gap: 20px;
      border-bottom: 1px solid #1f5c33; flex-wrap: wrap;
    }
    nav a { color: #4dff88; text-decoration: none; font-size: 14px; font-weight: bold; }
    nav a:hover { color: #fff; text-shadow: 0 0 6px #4dff88; }

    #wrap { flex: 1; display: flex; overflow: hidden; position: relative; }
    #map { flex: 1; height: 100%; background: #04120a; position: relative; }

    .leaflet-tile { filter: grayscale(1) invert(1) brightness(0.6)
                            sepia(1) hue-rotate(70deg) saturate(3); }

    #painel {
      width: 300px; background: #0a1f12; color: #b6ffcf;
      display: flex; flex-direction: column; height: 100%;
      border-left: 1px solid #1f5c33;
    }
    #painel header {
      padding: 12px 15px; background: #0d2b18; font-size: 16px; font-weight: bold;
      color: #4dff88;
    }
    #status { font-size: 12px; opacity: 0.8; margin-top: 4px; font-weight: normal; }

    #area { padding: 10px 15px; background: #08180e; font-size: 11px; }
    #area h4 { color: #4dff88; margin-bottom: 6px; }
    .campo { margin-bottom: 6px; }
    .campo label { display: block; margin-bottom: 2px; opacity: 0.7; }
    .campo input {
      width: 100%; padding: 5px; background: #0d2b18; border: 1px solid #1f5c33;
      color: #b6ffcf; border-radius: 4px; font-size: 11px;
    }
    #area button {
      width: 100%; padding: 7px; border: none; border-radius: 5px; margin-top: 4px;
      background: #1f5c33; color: #fff; cursor: pointer; font-weight: bold;
    }
    #area button:hover { background: #2e8b4f; }

    #opcoes { padding: 0 15px 10px; font-size: 11px; }
    #opcoes label { display: flex; align-items: center; gap: 6px; cursor: pointer; }

    #filtros { padding: 10px 15px; display: flex; gap: 8px; }
    #filtros button {
      flex: 1; padding: 8px; border: none; border-radius: 6px;
      background: #0d2b18; color: #b6ffcf; cursor: pointer; font-size: 12px;
    }
    #filtros button.ativo { background: #1f5c33; color: #fff; }

    #lista { flex: 1; overflow-y: auto; padding: 5px; }
    .item {
      background: #0d2b18; margin: 5px; padding: 10px; border-radius: 8px;
      cursor: pointer; border-left: 4px solid #4dff88; transition: background 0.2s;
    }
    .item:hover { background: #133d22; }
    .item .call { font-weight: bold; font-size: 14px; color: #fff; }
    .item .info { font-size: 11px; opacity: 0.8; margin-top: 3px; }

    /* ── Radar ── Wrapper: só posiciona no centro geográfico */
    #radar-sweep {
      position: absolute; top: 50%; left: 50%;
      width: 150vh; height: 150vh;
      margin-left: -75vh; margin-top: -75vh;   /* centraliza sem usar transform */
      pointer-events: none; z-index: 999; border-radius: 50%; overflow: hidden;
    }
    /* Feixe que GIRA */
    #radar-sweep .feixe {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; border-radius: 50%;
      background: conic-gradient(from 0deg,
        rgba(77, 255, 136, 0.35) 0deg, rgba(77, 255, 136, 0.08) 25deg,
        transparent 60deg, transparent 360deg);
      animation: girar 4s linear infinite;
    }
    /* Anéis fixos */
    #radar-sweep .aneis {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; border-radius: 50%; pointer-events: none;
      background:
        radial-gradient(circle, transparent 24%, rgba(77,255,136,0.15) 25%, transparent 26%),
        radial-gradient(circle, transparent 49%, rgba(77,255,136,0.15) 50%, transparent 51%),
        radial-gradient(circle, transparent 74%, rgba(77,255,136,0.15) 75%, transparent 76%);
      border: 1px solid rgba(77,255,136,0.1);
    }
    @keyframes girar { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    @media (max-width: 768px) {
      body { height: auto; min-height: 100vh; overflow: auto; }
      #wrap { flex-direction: column; overflow: visible; height: auto; }
      #map { height: 50vh; flex: none; }
      #painel { width: 100%; height: auto; border-left: none; border-top: 1px solid #1f5c33; }
      #lista { max-height: 45vh; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="/">🏠 Início</a>
    <a href="/busca">🔎 Busca ICAO/IATA</a>
    <a href="/mapa">🗺️ Mapa ao vivo</a>
  </nav>

  <div id="wrap">
    <div id="map">
      <div id="radar-sweep">
        <div class="aneis"></div>
        <div class="feixe"></div>
      </div>
    </div>

    <div id="painel">
      <header>
        ✈️ Radar RJ
        <div id="status">Carregando...</div>
      </header>

      <div id="area">
        <h4>📍 Centro e raio do radar</h4>
        <div class="campo">
          <label>Latitude</label>
          <input id="lat" value="-22.8">
        </div>
        <div class="campo">
          <label>Longitude</label>
          <input id="lon" value="-43.4">
        </div>
        <div class="campo">
          <label>Raio (milhas náuticas, máx. 250)</label>
          <input id="raio" value="80">
        </div>
        <button onclick="aplicarArea()">🔄 Aplicar</button>
      </div>

      <div id="opcoes">
        <label>
          <input type="checkbox" id="chkRastro" checked>
          📡 Mostrar rastro dos aviões
        </label>
      </div>

      <div id="filtros">
        <button data-f="todos" class="ativo">Todos</button>
        <button data-f="voo">Em voo</button>
        <button data-f="solo">No solo</button>
      </div>
      <div id="lista"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([-22.8, -43.4], 9);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let marcadores = {}, filtroAtual = "todos", dadosAtuais = [];
    let circuloArea = null;

    const detalhesAviao = {};
    const historico = {};
    const trilhas = {};
    const MAX_PONTOS = 15;
    let mostrarRastro = true;

    const NM_PARA_METROS = 1852; // 1 milha náutica = 1852 m

    function corPorAltitude(alt, solo) {
      if (solo) return "#9e9e9e";
      if (alt < 1500) return "#ff5252";
      if (alt < 4000) return "#ffab40";
      if (alt < 8000) return "#ffff00";
      return "#40c4ff";
    }

    function iconeAviao(rumo, cor) {
      return L.divIcon({
        className: '',
        html: `<div style="transform: rotate(${rumo}deg); font-size:22px;
                 color:${cor}; text-shadow:0 0 6px ${cor};">✈️</div>`,
        iconSize: [24, 24], iconAnchor: [12, 12]
      });
    }

    function moverSuave(marcador, destLat, destLon) {
      const inicio = marcador.getLatLng();
      const passos = 60, duracao = 2000;
      let passo = 0;
      const dLat = (destLat - inicio.lat) / passos;
      const dLon = (destLon - inicio.lng) / passos;
      const timer = setInterval(() => {
        passo++;
        marcador.setLatLng([inicio.lat + dLat*passo, inicio.lng + dLon*passo]);
        if (passo >= passos) clearInterval(timer);
      }, duracao / passos);
    }

    function passaFiltro(a) {
      if (filtroAtual === "voo") return !a.solo;
      if (filtroAtual === "solo") return a.solo;
      return true;
    }

    function atualizarRastro(a) {
      if (!historico[a.icao]) historico[a.icao] = [];
      const pontos = historico[a.icao];
      const ultimo = pontos[pontos.length - 1];
      if (!ultimo || ultimo[0] !== a.lat || ultimo[1] !== a.lon) {
        pontos.push([a.lat, a.lon]);
        if (pontos.length > MAX_PONTOS) pontos.shift();
      }
      if (trilhas[a.icao]) { map.removeLayer(trilhas[a.icao]); delete trilhas[a.icao]; }
      if (mostrarRastro && pontos.length >= 2) {
        trilhas[a.icao] = L.polyline(pontos, {
          color: corPorAltitude(a.alt, a.solo),
          weight: 2, opacity: 0.6, dashArray: "4,4"
        }).addTo(map);
      }
    }

    function atualizarLista(avioes) {
      const lista = document.getElementById('lista');
      lista.innerHTML = "";
      avioes.forEach(a => {
        const div = document.createElement('div');
        div.className = 'item';
        div.style.borderLeftColor = corPorAltitude(a.alt, a.solo);
        div.innerHTML = `
          <div class="call">${a.bandeira} ${a.callsign}</div>
          <div class="info">
            ${a.registro ? a.registro + " • " : ""}${a.tipo || ""}<br>
            Alt: ${Math.round(a.alt)} ft • Vel: ${Math.round(a.veloc)} nós
            • ${a.solo ? "No solo" : "Em voo"}
          </div>`;
        div.onclick = () => {
          map.setView([a.lat, a.lon], 11);
          if (marcadores[a.icao]) marcadores[a.icao].openPopup();
        };
        lista.appendChild(div);
      });
    }

    function lerCentro() {
      return {
        lat: parseFloat(document.getElementById('lat').value),
        lon: parseFloat(document.getElementById('lon').value),
        raio: Math.max(1, Math.min(parseFloat(document.getElementById('raio').value) || 80, 250))
      };
    }

    function urlComArea() {
      const c = lerCentro();
      const p = new URLSearchParams({ lat: c.lat, lon: c.lon, raio: c.raio });
      return '/api/trafego?' + p.toString();
    }

    function desenharArea() {
      const c = lerCentro();
      if (circuloArea) map.removeLayer(circuloArea);
      circuloArea = L.circle([c.lat, c.lon], {
        radius: c.raio * NM_PARA_METROS,
        color: "#4dff88", weight: 1.5, fill: true,
        fillColor: "#4dff88", fillOpacity: 0.05, dashArray: "6,6"
      }).addTo(map);
    }

    // Recentra o sweep no centro geográfico do círculo (sem transform — só posição)
    function centrarSweep() {
      const c = lerCentro();
      if (isNaN(c.lat) || isNaN(c.lon)) return;
      const p = map.latLngToContainerPoint([c.lat, c.lon]);
      const sweep = document.getElementById('radar-sweep');
      sweep.style.left = p.x + 'px';
      sweep.style.top  = p.y + 'px';
      // NÃO usar transform aqui — a margem negativa já centraliza,
      // e o transform é exclusivo da animação do feixe.
    }

    map.on('move zoom resize', centrarSweep);

    function aplicarArea() {
      Object.values(marcadores).forEach(m => map.removeLayer(m));
      Object.values(trilhas).forEach(t => map.removeLayer(t));
      marcadores = {};
      for (const k in trilhas) delete trilhas[k];
      for (const k in historico) delete historico[k];
      desenharArea();
      map.fitBounds(circuloArea.getBounds());
      centrarSweep();
      carregarAvioes();
    }

    async function carregarAvioes() {
      try {
        const resp = await fetch(urlComArea());
        dadosAtuais = await resp.json();
        renderizar();
        const hora = new Date().toLocaleTimeString('pt-BR');
        document.getElementById('status').textContent =
          `${dadosAtuais.length} aeronave(s) • ${hora}`;
      } catch (e) {
        document.getElementById('status').textContent = "Erro ao carregar";
      }
    }

    // Monta o bloco extra do popup com dados da API + Hexdb
    function textoExtra(a, d) {
      let s = "";
      if (a.emergencia)
        s += `<div style="color:#ff5252;font-weight:bold">🚨 EMERGÊNCIA (${a.squawk})</div>`;
      if (a.pais !== "Desconhecido") s += "🌎 " + a.pais + "<br>";
      if (a.registro) s += "🏷️ " + a.registro + "<br>";
      if (a.tipo) s += "✈️ " + a.tipo + (a.modelo ? " – " + a.modelo : "") + "<br>";
      if (a.subindo > 100) s += "⬆️ Subindo<br>";
      else if (a.subindo < -100) s += "⬇️ Descendo<br>";
      if (d && (d.fabricante || d.dono)) {
        s += "<hr style='margin:6px 0'>";
        if (d.fabricante) s += "🏭 " + d.fabricante + "<br>";
        if (d.dono) s += "🏢 " + d.dono;
      }
      return s ? "<hr style='margin:6px 0'>" + s : "";
    }

    function renderizar() {
      const filtrados = dadosAtuais.filter(passaFiltro);
      const ativos = new Set();

      filtrados.forEach(a => {
        ativos.add(a.icao);
        const cor = corPorAltitude(a.alt, a.solo);
        atualizarRastro(a);

        const popup = `
          <b>${a.bandeira} ${a.callsign}</b><br>
          Altitude: ${Math.round(a.alt)} ft<br>
          Velocidade: ${Math.round(a.veloc)} nós<br>
          Situação: ${a.solo ? "No solo" : "Em voo"}`;

        const popupCompleto = popup + textoExtra(a, detalhesAviao[a.icao]);

        if (marcadores[a.icao]) {
          moverSuave(marcadores[a.icao], a.lat, a.lon);
          marcadores[a.icao].setIcon(iconeAviao(a.rumo, cor));
          marcadores[a.icao].setPopupContent(popupCompleto);
          marcadores[a.icao]._popupBase = popup;
          marcadores[a.icao]._dados = a;
        } else {
          const marcador = L.marker([a.lat, a.lon],
            { icon: iconeAviao(a.rumo, cor) }).addTo(map).bindPopup(popupCompleto);
          marcador._popupBase = popup;
          marcador._dados = a;

          marcador.on('popupopen', async () => {
            if (detalhesAviao[a.icao]) return;
            try {
              const r = await fetch('/api/aviao/' + a.icao);
              const d = await r.json();
              detalhesAviao[a.icao] = d;
              marcador.setPopupContent(marcador._popupBase + textoExtra(marcador._dados, d));
            } catch (e) {}
          });

          marcadores[a.icao] = marcador;
        }
      });

      Object.keys(marcadores).forEach(icao => {
        if (!ativos.has(icao)) {
          map.removeLayer(marcadores[icao]);
          delete marcadores[icao];
          if (trilhas[icao]) { map.removeLayer(trilhas[icao]); delete trilhas[icao]; }
          delete historico[icao];
        }
      });

      atualizarLista(filtrados);
    }

    document.querySelectorAll('#filtros button').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('#filtros button')
          .forEach(b => b.classList.remove('ativo'));
        btn.classList.add('ativo');
        filtroAtual = btn.dataset.f;
        renderizar();
      };
    });

    document.getElementById('chkRastro').addEventListener('change', (e) => {
      mostrarRastro = e.target.checked;
      if (!mostrarRastro) {
        Object.values(trilhas).forEach(t => map.removeLayer(t));
        for (const k in trilhas) delete trilhas[k];
      } else {
        renderizar();
      }
    });

    window.addEventListener('resize', () => { map.invalidateSize(); centrarSweep(); });

    // Inicialização
    desenharArea();
    map.fitBounds(circuloArea.getBounds());
    centrarSweep();
    carregarAvioes();
    setInterval(carregarAvioes, 100000);
  </script>
</body>
</html>
